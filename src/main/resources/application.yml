spring:
  application:
    name: moneyguard-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moneyguard}?currentSchema=moneyguard
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: moneyguard
  flyway:
    schemas: moneyguard
    default-schema: moneyguard

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT12H}
    issuer: moneyguard-api
  crypto:
    key: ${CRYPTO_KEY}
  cors:
    origins: ${CORS_ORIGINS:https://moneyguard.fabrodiego.com}
